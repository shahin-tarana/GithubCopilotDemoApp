<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Copilot App</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <span class="eyebrow">Workspace initialized</span>
        <h1>GitHub Copilot App</h1>
        <p>
          This starter app is ready to use as a foundation for your next project.
        </p>
        <div class="actions">
          <button id="healthButton">Check app health</button>
        </div>
      </section>

      <section class="panel">
        <h2>Application status</h2>
        <p id="statusText">Waiting for a health check...</p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
